appId: io.github.openflycut.app
productName: OpenFlyCut
directories:
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.env,.env.*,.npmrc}'
extraResources:
  - from: resources
    to: .
publish: null
win:
  executableName: OpenFlyCut
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target:
    - dmg
    - zip
  icon: build/icon.icns
  category: public.app-category.utilities
linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Utility
deb:
  maintainer: OpenFlyCut Contributors <openflycut@users.noreply.github.com>
